<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة | FlexDays</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#1679d7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif; --font-brand:'Plus Jakarta Sans',system-ui,sans-serif; --blue:#1679d7; --blue-dk:#0e5fad; --dark:#1E1E24; --mid:#6B6B76; --border:#D9DCE1; }
    body { font-family:var(--font-body); color:var(--dark); background:#fff; line-height:1.85; -webkit-font-smoothing:antialiased; }
    .container { max-width:1000px; margin:0 auto; padding:0 24px; }
    a { color:var(--blue); }
    h1 { font-size:clamp(28px,4.4vw,40px); font-weight:700; line-height:1.35; margin-bottom:10px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 22px; border-radius:10px; font-weight:700; font-size:15px; text-decoration:none; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { background:var(--blue-dk); }
    .btn-outline { border:1px solid var(--blue); color:var(--blue); }
    nav { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-inner { display:flex; align-items:center; justify-content:space-between; padding:12px 0; }
    .lang { font-family:'DM Sans',system-ui,sans-serif; font-weight:600; font-size:14px; color:var(--dark); text-decoration:none; }
    .brand { display:flex; align-items:center; gap:8px; text-decoration:none; }
    .brand img { height:34px; width:34px; }
    .brand-name { font-family:var(--font-brand); font-size:24px; font-weight:800; color:var(--dark); letter-spacing:-.5px; }
    main { text-align:center; padding:64px 24px 72px; }
    .lead { color:var(--mid); max-width:520px; margin:0 auto; }
    .actions { margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    footer { background:var(--dark); color:rgba(255,255,255,.55); padding:32px 0 26px; font-size:13px; }
  </style>
</head>
<body>
<nav><div class="container nav-inner">
  <a href="/ar/" class="brand" aria-label="الصفحة الرئيسية لـ FlexDays"><img src="/icon-96.png" alt="شعار FlexDays" /><span class="brand-name">FlexDays</span></a>
  <a href="/" class="lang" lang="en" hreflang="en">English</a>
</div></nav>

<main>
  <p style="font-size:64px;line-height:1.2">🗓️</p>
  <h1>هذه الصفحة في إجازة اليوم.</h1>
  <p class="lead">لم نعثر على الصفحة التي تبحث عنها. ربما نُقلت، أو أن الرابط غير صحيح.</p>
  <div class="actions">
    <a href="/ar/" class="btn btn-primary">الذهاب إلى الصفحة الرئيسية</a>
    <a href="https://portal.flexdays.app/register" class="btn btn-outline">ابدأ مجانًا</a>
  </div>
</main>

<footer><div class="container">© 2026 FlexDays. تأخير أقل، مرونة أكثر مع FlexDays.</div></footer>
</body>
</html>
